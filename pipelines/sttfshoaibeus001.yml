# yaml-language-server: $schema=
# =========================================
# STORAGE ACCOUNT BOOTSTRAP PIPELINE
# Creates the backend storage account and containers for Terraform state management
# =========================================

trigger: none

parameters:
  - name: action
    displayName: Action
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy

pool:
  vmImage: ubuntu-latest

variables:
  - name: workingDir
    value: $(System.DefaultWorkingDirectory)/resources/sttfshoaibeus001
  - name: resourceGroupName
    value: 'rg-shoaib-projects-eus-001'
  - name: storageAccountName
    value: 'sttfshoaibeus001'

stages:
  # =========================================
  # PLAN STAGE — always runs
  # =========================================
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: Plan
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: latest

          - bash: terraform init
            displayName: Terraform Init
            workingDirectory: $(workingDir)
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - task: TerraformTaskV4@4
            displayName: Terraform Plan
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: $(workingDir)
              environmentServiceNameAzureRM: Azure-DevOps-to-Azure

  # =========================================
  # APPLY STAGE — only when action = apply
  # =========================================
  - ${{ if eq(parameters.action, 'apply') }}:
    - stage: Apply
      displayName: Terraform Apply
      dependsOn: Plan
      condition: succeeded()
      jobs:
        - deployment: Apply
          displayName: Terraform Apply
          environment: test
          strategy:
            runOnce:
              deploy:
                steps:
                  - checkout: self

                  - task: TerraformInstaller@1
                    displayName: Install Terraform
                    inputs:
                      terraformVersion: latest

                  - bash: terraform init
                    displayName: Terraform Init
                    workingDirectory: $(workingDir)
                    env:
                      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
                      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
                      ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
                      ARM_TENANT_ID: $(ARM_TENANT_ID)

                  - task: TerraformTaskV4@4
                    displayName: Terraform Apply
                    inputs:
                      provider: azurerm
                      command: apply
                      workingDirectory: $(workingDir)
                      environmentServiceNameAzureRM: Azure-DevOps-to-Azure

  # =========================================
  # DESTROY STAGE — only when action = destroy
  # Deletes only the storage account and containers, not the resource group
  # =========================================
  - ${{ if eq(parameters.action, 'destroy') }}:
    - stage: Destroy
      displayName: Destroy Storage Account
      dependsOn: Plan
      condition: succeeded()
      jobs:
        - deployment: Destroy
          displayName: Delete Storage Account
          environment: test
          strategy:
            runOnce:
              deploy:
                steps:
                  - task: AzureCLI@2
                    displayName: Delete Storage Account and Containers
                    inputs:
                      azureSubscription: Azure-DevOps-to-Azure
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        echo "Deleting storage account $(storageAccountName)..."
                        az storage account delete \
                          --name $(storageAccountName) \
                          --resource-group $(resourceGroupName) \
                          --yes
                        echo "Done — storage account and all containers deleted."